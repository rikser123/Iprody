spring:
  application:
    name: payments
  datasource:
    driver-class-name: org.postgresql.Driver 
    hikari:
      schema: iprody-payments
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
    default-schema: iprody-payments
    liquibase-schema: iprody-payments
    drop-first: false  

server:
  port: 8081
